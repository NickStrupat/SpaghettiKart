<!doctype html>
<!-- The page of the browser build (docs/WEB.md). Emscripten puts the game's script where {{{ SCRIPT }}} is. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpaghettiKart</title>
<!-- No icon: keeps the browser from asking the server for one. -->
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; height: 100dvh; background: #000; color: #ddd; font: 16px system-ui, sans-serif; overflow: hidden; }
  /* The game sizes its picture to the canvas, which fills the window. */
  /* 100vh on iOS Safari is the height with the toolbars away, so the bottom of the picture hid behind them: dvh is
     what shows. */
  #canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; outline: none; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 16px; align-items: center;
             justify-content: center; text-align: center; padding: 16px; pointer-events: none; }
  #status { white-space: pre-wrap; max-width: 40em; }
  #status:empty { display: none; }
  #picker { pointer-events: auto; }
  #picker[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="overlay">
  <div id="status">Loading…</div>
  <input id="picker" type="file" accept=".z64,.n64,.v64,.zip" hidden>
</div>
<script>
const statusElement = document.getElementById('status');
const pickerElement = document.getElementById('picker');

// The game's files: the two archives it reads everything from. spaghetti.o2r is the port's own and must be next to
// this page. mk64.o2r holds the game's own data: when the server has none, the player is asked for their ROM, which
// ExtractWorker.js turns into it here.
const kGameArchive = 'mk64.o2r';
const kPortArchive = 'spaghetti.o2r';
// The one ROM the archive maker knows: Mario Kart 64 (US), by the SHA-1 of its .z64 form (as src/port/GameExtractor.cpp).
const kRomSha1 = '579c48e211ae952530ffc8738709f078d5dd215e';
// The folder the game runs in: libultraship looks for archives, settings and saves in the working directory. It is
// in memory only.
const kGameDir = '/game';
// Kept in the browser's storage (IndexedDB): a copy of what the game wrote to its folder, and the player's own
// mk64.o2r under kKeptArchives.
const kSaveDir = '/save';
const kKeptArchives = '.archives';
// What in the game's folder is not worth keeping: the archives are loaded again, the log is of this run.
const kNotSaved = new Set([kGameArchive, kPortArchive, 'logs']);
const kSaveIntervalMs = 3000;

function showStatus(text) {
  statusElement.textContent = text;
}

/** Every file under a folder, as a map from its path below the folder to a stamp that changes when the file does. */
function listFiles(dir, skip) {
  const files = new Map();
  const walk = (prefix) => {
    for (const name of FS.readdir(`${dir}/${prefix}`)) {
      if (name === '.' || name === '..' || (prefix === '' && skip.has(name))) {
        continue;
      }
      const path = prefix + name;
      const stat = FS.stat(`${dir}/${path}`);
      if (FS.isDir(stat.mode)) {
        walk(`${path}/`);
      } else {
        files.set(path, `${stat.mtime.getTime()}:${stat.size}`);
      }
    }
  };
  walk('');
  return files;
}

function copyFile(from, to) {
  FS.mkdirTree(to.slice(0, to.lastIndexOf('/')));
  FS.writeFile(to, FS.readFile(from));
}

function syncStorage(fromStorage) {
  return new Promise((resolve, reject) => FS.syncfs(fromStorage, (error) => (error ? reject(error) : resolve())));
}

let savedFiles = new Map();
let storageBusy = false;

/** Copies what the game changed in its folder to the browser's storage. */
function saveChanges() {
  if (storageBusy) {
    return;
  }
  const files = listFiles(kGameDir, kNotSaved);
  let changed = false;
  for (const [path, stamp] of files) {
    if (savedFiles.get(path) !== stamp) {
      copyFile(`${kGameDir}/${path}`, `${kSaveDir}/${path}`);
      changed = true;
    }
  }
  for (const path of savedFiles.keys()) {
    if (!files.has(path)) {
      FS.unlink(`${kSaveDir}/${path}`);
      changed = true;
    }
  }
  savedFiles = files;
  if (changed) {
    storageBusy = true;
    syncStorage(false).catch((error) => console.error('Saving to the browser\'s storage failed', error))
      .finally(() => { storageBusy = false; });
  }
}

/** The player's choice of a file, once they made it. */
function pickFile() {
  return new Promise((resolve) => {
    // Picking the same file again after a problem must still count as a choice.
    pickerElement.value = '';
    pickerElement.hidden = false;
    pickerElement.onchange = async () => {
      if (pickerElement.files.length > 0) {
        pickerElement.hidden = true;
        resolve(new Uint8Array(await pickerElement.files[0].arrayBuffer()));
      }
    };
  });
}

/**
 * The ROM in .z64 byte order, whichever of the three a dump came in, by its first word: .z64 is big-endian, .v64 swaps
 * each pair of bytes, .n64 reverses each word. Null when it is no N64 ROM.
 */
function toZ64(rom) {
  const word = rom.length >= 4 ? (rom[0] << 24 | rom[1] << 16 | rom[2] << 8 | rom[3]) >>> 0 : 0;
  const swapped = new Uint8Array(rom.length);
  if (word === 0x80371240) {
    return rom;
  } else if (word === 0x37804012) {
    for (let i = 0; i + 1 < rom.length; i += 2) {
      swapped[i] = rom[i + 1];
      swapped[i + 1] = rom[i];
    }
    return swapped;
  } else if (word === 0x40123780) {
    for (let i = 0; i + 3 < rom.length; i += 4) {
      swapped[i] = rom[i + 3];
      swapped[i + 1] = rom[i + 2];
      swapped[i + 2] = rom[i + 1];
      swapped[i + 3] = rom[i];
    }
    return swapped;
  }
  return null;
}

async function sha1(bytes) {
  const digest = new Uint8Array(await crypto.subtle.digest('SHA-1', bytes));
  return Array.from(digest, (byte) => byte.toString(16).padStart(2, '0')).join('');
}

/** mk64.o2r made from the ROM by the archive maker, on a worker. */
function extractArchive(rom) {
  return new Promise((resolve, reject) => {
    const worker = new Worker('ExtractWorker.js', { type: 'module' });
    worker.onmessage = ({ data }) => {
      worker.terminate();
      data.error ? reject(new Error(data.error)) : resolve(data.archive);
    };
    worker.onerror = (event) => {
      worker.terminate();
      reject(new Error(event.message || 'The archive maker did not start.'));
    };
    worker.postMessage(rom, [rom.buffer]);
  });
}

/**
 * Whether these bytes are a game archive: a zip file whose directory lists mods.toml, which names the archive for the
 * game. Any other zip (a zipped ROM, say) would start the game without its data and stop it on a dependency error.
 */
function isGameArchive(bytes) {
  if (bytes.length < 22 || bytes[0] !== 0x50 || bytes[1] !== 0x4b) {
    return false;
  }
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  // The end-of-directory record is in the last 64 KB, behind an optional comment.
  for (let at = bytes.length - 22; at >= Math.max(0, bytes.length - 22 - 0xffff); at--) {
    if (view.getUint32(at, true) === 0x06054b50) {
      const size = view.getUint32(at + 12, true);
      const start = view.getUint32(at + 16, true);
      if (start + size > bytes.length) {
        return false;
      }
      const directory = new TextDecoder('latin1').decode(bytes.subarray(start, start + size));
      return directory.includes('mods.toml');
    }
  }
  return false;
}

/**
 * The biggest file in a zip, which is the ROM in a zipped dump; null when these bytes are no zip or hold nothing
 * the browser can unpack (it does stored and deflated files).
 */
async function romFromZip(bytes) {
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let end = -1;
  for (let at = bytes.length - 22; at >= Math.max(0, bytes.length - 22 - 0xffff); at--) {
    if (view.getUint32(at, true) === 0x06054b50) {
      end = at;
      break;
    }
  }
  if (end < 0) {
    return null;
  }
  let best = null;
  let at = view.getUint32(end + 16, true);
  for (let n = view.getUint16(end + 10, true); n > 0 && at + 46 <= bytes.length; n--) {
    if (view.getUint32(at, true) !== 0x02014b50) {
      return null;
    }
    const entry = {
      method: view.getUint16(at + 10, true),
      packed: view.getUint32(at + 20, true),
      size: view.getUint32(at + 24, true),
      header: view.getUint32(at + 42, true),
    };
    if ((best === null || entry.size > best.size) && (entry.method === 0 || entry.method === 8)) {
      best = entry;
    }
    at += 46 + view.getUint16(at + 28, true) + view.getUint16(at + 30, true) + view.getUint16(at + 32, true);
  }
  if (best === null || view.getUint32(best.header, true) !== 0x04034b50) {
    return null;
  }
  const start = best.header + 30 + view.getUint16(best.header + 26, true) + view.getUint16(best.header + 28, true);
  const data = bytes.subarray(start, start + best.packed);
  if (best.method === 0) {
    return data;
  }
  const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

/** The game's archive, made here from the ROM the player picks. */
async function askForGameArchive() {
  let problem = '';
  for (;;) {
    showStatus(`${problem}Choose your Mario Kart 64 ROM (US version; .z64, .n64 or .v64, or a zip of one). The game's files are made ` +
               'from it right here and kept in this browser; nothing is uploaded.');
    let file = await pickFile();
    if (file[0] === 0x50 && file[1] === 0x4b) {
      // A zipped dump: the ROM is what is inside.
      try {
        file = (await romFromZip(file)) || file;
      } catch (error) {
        console.error(error);
      }
    }
    const rom = toZ64(file);
    if (rom === null) {
      problem = 'That file is not an N64 ROM.\n\n';
      continue;
    }
    if (await sha1(rom) !== kRomSha1) {
      problem = 'That ROM is not the US version of Mario Kart 64, the only one SpaghettiKart can use.\n\n';
      continue;
    }
    showStatus('Making the game\'s files from your ROM: about 20 seconds, only this once…');
    try {
      return await extractArchive(rom);
    } catch (error) {
      console.error(error);
      problem = `Making the game's files failed: ${error.message}\n\n`;
    }
  }
}

async function fetchArchive(name) {
  const response = await fetch(name);
  return response.ok ? new Uint8Array(await response.arrayBuffer()) : null;
}

/** Fills the game's folder: saves and settings from the browser's storage, then the two archives. */
async function prepareGameFolder() {
  FS.mkdir(kGameDir);
  FS.mkdir(kSaveDir);
  FS.mount(IDBFS, {}, kSaveDir);
  await syncStorage(true);
  for (const path of listFiles(kSaveDir, new Set([kKeptArchives])).keys()) {
    copyFile(`${kSaveDir}/${path}`, `${kGameDir}/${path}`);
  }
  savedFiles = listFiles(kGameDir, kNotSaved);

  showStatus('Loading the game files…');
  const [portArchive, serverGameArchive] = await Promise.all([fetchArchive(kPortArchive), fetchArchive(kGameArchive)]);
  if (portArchive === null) {
    throw new Error(`${kPortArchive} is missing next to this page.`);
  }
  let gameArchive = serverGameArchive;
  const keptPath = `${kSaveDir}/${kKeptArchives}/${kGameArchive}`;
  if (gameArchive === null) {
    try {
      gameArchive = FS.readFile(keptPath);
      if (!isGameArchive(gameArchive)) {
        // Kept by an earlier visit, but no game archive: the ROM is asked for again.
        console.error('The kept mk64.o2r is not a game archive; discarding it.');
        gameArchive = null;
      }
    } catch (error) {
      // Not kept yet: asked for below.
    }
  }
  if (gameArchive === null) {
    gameArchive = await askForGameArchive();
    FS.mkdirTree(`${kSaveDir}/${kKeptArchives}`);
    FS.writeFile(keptPath, gameArchive);
    await syncStorage(false);
  }
  FS.writeFile(`${kGameDir}/${kPortArchive}`, portArchive);
  FS.writeFile(`${kGameDir}/${kGameArchive}`, gameArchive);
  FS.chdir(kGameDir);
}

var Module = {
  canvas: document.getElementById('canvas'),
  print: (text) => console.log(text),
  printErr: (text) => console.error(text),
  setStatus: (text) => {
    // Emscripten reports its own loading steps here, ending with "Running...": the game is on screen from then on.
    showStatus(text.startsWith('Running') ? '' : text);
  },
  preRun: [() => {
    if (!crossOriginIsolated) {
      showStatus('This page has to be served with the Cross-Origin-Opener-Policy and Cross-Origin-Embedder-Policy ' +
                 'headers, because the game uses threads. tools/web-serve.py sends them.');
      throw new Error('not cross-origin isolated');
    }
    // The game's test settings (SK_FAST, SK_DETERMINISM_..., see src/port/netplay/DeterminismHarness.h) come from the
    // page's address: index.html?SK_FAST=10&SK_DETERMINISM_ROLLBACK=8.
    for (const [name, value] of new URLSearchParams(location.search)) {
      if (name.startsWith('SK_')) {
        ENV[name] = value;
      }
    }
    // main() waits for this.
    addRunDependency('game-folder');
    prepareGameFolder().then(() => {
      showStatus('');
      removeRunDependency('game-folder');
      setInterval(saveChanges, kSaveIntervalMs);
      // The last chance before the page goes away.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') {
          saveChanges();
        }
      });
    }).catch((error) => {
      console.error(error);
      showStatus(String(error.message || error));
    });
  }],
  onAbort: (what) => {
    showStatus(`The game stopped: ${what}\nThe browser's console has the details.`);
  },
};
window.addEventListener('error', (event) => {
  if (statusElement.textContent === '') {
    showStatus(`The game stopped: ${event.message}\nThe browser's console has the details.`);
  }
});
</script>
{{{ SCRIPT }}}
</body>
</html>
