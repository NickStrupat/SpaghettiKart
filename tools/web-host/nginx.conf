# The browser build's web server on the public relay's computer (tools/web-deploy.sh puts it there). Traefik in front
# of it adds HTTPS and sends WebSocket requests for the same name to the relay instead.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The game uses threads, which browsers allow only on a cross-origin isolated page (docs/WEB.md).
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    # Revalidate every load, so a new build is picked up at once; unchanged files cost only a 304.
    add_header Cache-Control no-cache always;

    gzip on;
    gzip_types application/wasm application/javascript application/octet-stream;
    gzip_min_length 1024;

    # Nintendo's data never goes on the server (the deploy script leaves it out too): the page asks the player for it.
    location = /mk64.o2r {
        return 404;
    }
}
